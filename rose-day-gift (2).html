<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Rose Day Gift 🌹</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #ffeef8 0%, #ffe0f0 50%, #ffd4e5 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Floating petals background */
        .floating-petal {
            position: absolute;
            width: 20px;
            height: 20px;
            background: radial-gradient(ellipse at center, #ff69b4 0%, #ff1493 100%);
            border-radius: 50% 0 50% 0;
            opacity: 0.3;
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.3;
            }
            50% {
                transform: translateY(-100px) rotate(180deg);
                opacity: 0.6;
            }
        }

        /* Gift Box Section */
        #giftSection {
            text-align: center;
            display: block;
        }

        #giftSection.hidden {
            display: none;
        }

        .gift-container {
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .gift-container:hover {
            transform: scale(1.05);
        }

        .gift-box {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            border-radius: 10px;
            position: relative;
            box-shadow: 0 10px 40px rgba(231, 76, 60, 0.4);
            margin: 0 auto;
        }

        .gift-lid {
            width: 220px;
            height: 40px;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            position: absolute;
            top: -20px;
            left: -10px;
            border-radius: 10px;
            transition: all 0.8s ease;
        }

        .ribbon-v {
            width: 30px;
            height: 200px;
            background: linear-gradient(90deg, #f1c40f 0%, #f39c12 100%);
            position: absolute;
            top: 0;
            left: 85px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .ribbon-h {
            width: 200px;
            height: 30px;
            background: linear-gradient(180deg, #f1c40f 0%, #f39c12 100%);
            position: absolute;
            top: 85px;
            left: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .bow {
            width: 60px;
            height: 60px;
            background: #f1c40f;
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(241, 196, 15, 0.5);
        }

        .bow::before,
        .bow::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            background: #f39c12;
            border-radius: 50%;
            top: 10px;
        }

        .bow::before {
            left: -30px;
        }

        .bow::after {
            right: -30px;
        }

        .gift-box.opening .gift-lid {
            transform: translateY(-100px) rotateX(45deg);
            opacity: 0;
        }

        .gift-text {
            margin-top: 40px;
            font-size: 24px;
            color: #c0392b;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        /* Countdown Section */
        #countdownSection {
            text-align: center;
            display: none;
            animation: fadeIn 1s ease;
        }

        #countdownSection.show {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .countdown-title {
            font-size: 42px;
            color: #c0392b;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.2);
            font-weight: bold;
        }

        .countdown-subtitle {
            font-size: 20px;
            color: #e74c3c;
            margin-bottom: 40px;
            font-style: italic;
        }

        .countdown-timer {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(231, 76, 60, 0.3);
            min-width: 100px;
        }

        .time-value {
            font-size: 48px;
            font-weight: bold;
            color: #c0392b;
            display: block;
        }

        .time-label {
            font-size: 16px;
            color: #e74c3c;
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Game Section */
        #gameSection {
            text-align: center;
            display: none;
        }

        #gameSection.show {
            display: block;
            animation: fadeIn 1s ease;
        }

        .game-title {
            font-size: 36px;
            color: #c0392b;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .game-instructions {
            font-size: 18px;
            color: #e74c3c;
            margin-bottom: 20px;
        }

        .progress-container {
            background: rgba(255, 255, 255, 0.8);
            padding: 15px 30px;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .progress-text {
            font-size: 20px;
            color: #c0392b;
            font-weight: bold;
        }

        #gameCanvas {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            cursor: none;
            display: block;
            margin: 0 auto;
        }

        /* Final Rose Section */
        #roseSection {
            text-align: center;
            display: none;
        }

        #roseSection.show {
            display: block;
            animation: fadeIn 2s ease;
        }

        .rose-container {
            position: relative;
            margin: 40px auto;
        }

        .rose {
            font-size: 150px;
            animation: bloom 2s ease;
            display: inline-block;
            filter: drop-shadow(0 10px 30px rgba(231, 76, 60, 0.5));
        }

        @keyframes bloom {
            0% {
                transform: scale(0) rotate(-180deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .final-message {
            font-size: 36px;
            color: #c0392b;
            margin-top: 30px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.2);
            animation: pulse 2s ease infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #ffd700;
            border-radius: 50%;
            animation: sparkle 1.5s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0;
                transform: scale(0);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Audio Control */
        .audio-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            font-size: 14px;
            color: #c0392b;
            transition: all 0.3s ease;
        }

        .audio-control:hover {
            background: rgba(255, 255, 255, 1);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <!-- Background floating petals -->
    <div class="floating-petal" style="left: 10%; animation-delay: 0s;"></div>
    <div class="floating-petal" style="left: 30%; animation-delay: 2s;"></div>
    <div class="floating-petal" style="left: 50%; animation-delay: 4s;"></div>
    <div class="floating-petal" style="left: 70%; animation-delay: 1s;"></div>
    <div class="floating-petal" style="left: 90%; animation-delay: 3s;"></div>

    <!-- Gift Box Section -->
    <div id="giftSection">
        <div class="gift-container" onclick="openGift()">
            <div class="gift-box" id="giftBox">
                <div class="gift-lid">
                    <div class="bow"></div>
                </div>
                <div class="ribbon-v"></div>
                <div class="ribbon-h"></div>
            </div>
        </div>
        <p class="gift-text">Click to open your gift 🎁</p>
    </div>

    <!-- Countdown Section -->
    <div id="countdownSection">
        <h1 class="countdown-title">Rose Day is Coming! 🌹</h1>
        <p class="countdown-subtitle">Something special awaits you...</p>
        <div class="countdown-timer" id="countdownTimer"></div>
    </div>

    <!-- Game Section -->
    <div id="gameSection">
        <h2 class="game-title">Catch the Rose Petals! 🌹</h2>
        <p class="game-instructions">Move your cursor to catch the falling petals</p>
        <div class="progress-container">
            <span class="progress-text">Petals Caught: <span id="petalCount">0</span>/10</span>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
    </div>

    <!-- Final Rose Section -->
    <div id="roseSection">
        <div class="rose-container">
            <div class="rose">🌹</div>
            <!-- Sparkles -->
            <div class="sparkle" style="top: 20%; left: 20%;"></div>
            <div class="sparkle" style="top: 30%; right: 20%; animation-delay: 0.3s;"></div>
            <div class="sparkle" style="bottom: 30%; left: 30%; animation-delay: 0.6s;"></div>
            <div class="sparkle" style="bottom: 20%; right: 30%; animation-delay: 0.9s;"></div>
        </div>
        <h2 class="final-message">A rose just for you.</h2>
    </div>

    <!-- Audio Element - Using a reliable romantic piano music source -->
    <audio id="bgMusic" loop preload="auto">
        <!-- Replace this URL with your own music file for best results -->
        <source src="https://cdn.pixabay.com/audio/2022/03/10/audio_4a8b474a55.mp3" type="audio/mpeg">
    </audio>
    
    <div class="audio-control" onclick="toggleMusic()" id="audioControl">
        🎵 Click here for music
    </div>

    <script>
        const targetDate = new Date('February 7, 2026 00:00:00').getTime();
        let musicPlaying = false;
        const bgMusic = document.getElementById('bgMusic');
        bgMusic.volume = 0.5; // Set volume to 50%

        function openGift() {
            // Start music immediately on user click
            playMusic();
            
            const giftBox = document.getElementById('giftBox');
            giftBox.classList.add('opening');
            
            setTimeout(() => {
                document.getElementById('giftSection').classList.add('hidden');
                document.getElementById('countdownSection').classList.add('show');
                startCountdown();
            }, 1000);
        }

        function startCountdown() {
            updateCountdown();
            const interval = setInterval(() => {
                const timeLeft = updateCountdown();
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    startGame();
                }
            }, 1000);
        }

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                return 0;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            const timerHTML = `
                <div class="time-box">
                    <span class="time-value">${days}</span>
                    <span class="time-label">Days</span>
                </div>
                <div class="time-box">
                    <span class="time-value">${hours}</span>
                    <span class="time-label">Hours</span>
                </div>
                <div class="time-box">
                    <span class="time-value">${minutes}</span>
                    <span class="time-label">Minutes</span>
                </div>
                <div class="time-box">
                    <span class="time-value">${seconds}</span>
                    <span class="time-label">Seconds</span>
                </div>
            `;

            document.getElementById('countdownTimer').innerHTML = timerHTML;
            return distance;
        }

        function startGame() {
            document.getElementById('countdownSection').classList.remove('show');
            document.getElementById('gameSection').classList.add('show');
            initGame();
        }

        // Game Logic
        let canvas, ctx, petals = [], petalsCaught = 0, mouseX = 0, mouseY = 0;

        function initGame() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            
            canvas.addEventListener('mousemove', (e) => {
                const rect = canvas.getBoundingClientRect();
                mouseX = e.clientX - rect.left;
                mouseY = e.clientY - rect.top;
            });

            // Create initial petals
            for (let i = 0; i < 3; i++) {
                createPetal();
            }

            gameLoop();
        }

        function createPetal() {
            petals.push({
                x: Math.random() * canvas.width,
                y: -20,
                speed: 2 + Math.random() * 2,
                size: 15 + Math.random() * 10,
                rotation: Math.random() * 360,
                rotationSpeed: (Math.random() - 0.5) * 5
            });
        }

        function drawPetal(petal) {
            ctx.save();
            ctx.translate(petal.x, petal.y);
            ctx.rotate(petal.rotation * Math.PI / 180);
            
            // Draw rose petal
            ctx.beginPath();
            ctx.ellipse(0, 0, petal.size, petal.size * 0.6, 0, 0, Math.PI * 2);
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, petal.size);
            gradient.addColorStop(0, '#ff69b4');
            gradient.addColorStop(1, '#ff1493');
            ctx.fillStyle = gradient;
            ctx.fill();
            
            ctx.restore();
        }

        function drawBasket(x, y) {
            // Basket body (brown woven basket)
            ctx.fillStyle = '#8B4513';
            ctx.beginPath();
            ctx.moveTo(x - 30, y - 10);
            ctx.lineTo(x - 35, y + 20);
            ctx.lineTo(x + 35, y + 20);
            ctx.lineTo(x + 30, y - 10);
            ctx.closePath();
            ctx.fill();
            
            // Basket rim
            ctx.fillStyle = '#A0522D';
            ctx.fillRect(x - 35, y - 12, 70, 4);
            
            // Basket weave pattern
            ctx.strokeStyle = '#654321';
            ctx.lineWidth = 2;
            for (let i = -30; i < 30; i += 8) {
                ctx.beginPath();
                ctx.moveTo(x + i, y - 10);
                ctx.lineTo(x + i - 5, y + 20);
                ctx.stroke();
            }
            
            // Basket handle
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(x, y - 10, 25, Math.PI, 0, false);
            ctx.stroke();
            
            // Inner shadow for depth
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(x - 30, y - 8, 60, 3);
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Update and draw petals
            for (let i = petals.length - 1; i >= 0; i--) {
                const petal = petals[i];
                petal.y += petal.speed;
                petal.rotation += petal.rotationSpeed;

                // Check if caught by basket
                const dx = petal.x - mouseX;
                const dy = petal.y - mouseY;
                
                // Basket catching area (wider horizontally, specific vertical range)
                if (Math.abs(dx) < 35 && dy > -15 && dy < 25) {
                    petals.splice(i, 1);
                    petalsCaught++;
                    document.getElementById('petalCount').textContent = petalsCaught;
                    
                    if (petalsCaught < 10) {
                        createPetal();
                    }
                    
                    if (petalsCaught === 10) {
                        setTimeout(showFinalRose, 500);
                        return;
                    }
                } else if (petal.y > canvas.height) {
                    // Petal fell off screen, create new one
                    petals.splice(i, 1);
                    if (petalsCaught < 10) {
                        createPetal();
                    }
                } else {
                    drawPetal(petal);
                }
            }

            // Draw basket cursor
            drawBasket(mouseX, mouseY);

            requestAnimationFrame(gameLoop);
        }

        function showFinalRose() {
            document.getElementById('gameSection').classList.remove('show');
            document.getElementById('roseSection').classList.add('show');
        }

        function playMusic() {
            bgMusic.play()
                .then(() => {
                    musicPlaying = true;
                    document.getElementById('audioControl').textContent = '🎵 Music: ON';
                })
                .catch(e => {
                    console.log('Music playback issue:', e);
                    musicPlaying = false;
                    document.getElementById('audioControl').textContent = '🎵 Click to Play Music';
                });
        }

        function toggleMusic() {
            if (musicPlaying) {
                bgMusic.pause();
                document.getElementById('audioControl').textContent = '🔇 Music: OFF';
                document.getElementById('audioControl').style.background = 'rgba(255, 200, 200, 0.9)';
                musicPlaying = false;
            } else {
                bgMusic.play()
                    .then(() => {
                        document.getElementById('audioControl').textContent = '🎵 Music: ON';
                        document.getElementById('audioControl').style.background = 'rgba(200, 255, 200, 0.9)';
                        musicPlaying = true;
                    })
                    .catch(e => {
                        console.log('Could not play music:', e);
                        alert('Music could not play. Please check your browser settings.');
                    });
            }
        }

        // For testing: Force game to start immediately (comment out for production)
        // setTimeout(() => openGift(), 100);
        // setTimeout(() => startGame(), 1500);
    </script>
</body>
</html>
